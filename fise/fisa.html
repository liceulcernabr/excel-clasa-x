<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fișă de lucru · Excel clasa a X-a</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='6' width='24' height='18' fill='none' stroke='%232344a8' stroke-width='3'/%3E%3Crect x='23' y='20' width='7' height='7' fill='%232344a8'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/print.css">
</head>
<body>
  <!-- fisa.html?ora=N — varianta printabilă A4 a fișei orei N.
       În modul profesor se tipărește și baremul. -->
  <main class="pagina" id="continut">
    <div class="bara-print nu-printa" id="bara"></div>
  </main>
  <script src="../config.js"></script>
  <script src="../data/functii.js"></script>
  <script src="../data/cuprins.js"></script>
  <script src="../assets/js/formula-engine.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/progress.js"></script>
  <script src="../assets/js/worksheet.js"></script>
  <script>
    (async function () {
      'use strict';
      const ora = parseInt(new URLSearchParams(location.search).get('ora'), 10) || 1;
      const pad = (n) => String(n).padStart(2, '0');
      App.init({ activ: 'acasa', casetaNume: 'Fișa ' + pad(ora) });
      const { el } = App;
      const main = document.getElementById('continut');
      await App.incarcaScript('../data/lectii/ora-' + pad(ora) + '.js').catch(() => null);
      const L = (window.DATE_LECTII || {})[ora];
      if (!L || !L.fisa) { main.append(el('div', { class: 'card' }, 'Fișa acestei ore nu este încă disponibilă.')); return; }
      document.title = 'Fișa de lucru ' + ora + ' — ' + L.fisa.titlu;
      document.getElementById('bara').append(
        el('a', { class: 'btn', href: '../lectii/ora-' + pad(ora) + '.html#fisa' }, '← Înapoi la lecție'),
        el('button', { class: 'btn btn-primar', type: 'button', onclick: () => print() }, '🖨 Printează'),
        el('button', { class: 'btn', type: 'button', onclick: () => Fise.descarcaXlsx(L.fisa) }, '⬇ ' + (L.fisa.fisier || '.xlsx')),
        el('span', { class: 'doar-profesor-inline', style: 'display:none;color:var(--rosu);font-weight:600' }, 'Modul profesor: se printează și baremul.'));
      const zona = el('div');
      main.append(zona);
      const deseneaza = () => { zona.replaceChildren(); Fise.paginaPrint(zona, L.fisa, ora, L.titlu); App.aplicaLimba(); };
      deseneaza();
      document.addEventListener('app:profesor', deseneaza);
    })();
  </script>
</body>
</html>
