<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teste · Excel clasa a X-a</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='6' width='24' height='18' fill='none' stroke='%232344a8' stroke-width='3'/%3E%3Crect x='23' y='20' width='7' height='7' fill='%232344a8'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <main class="pagina ingust" id="continut">
    <span class="eticheta">Teste</span>
    <h1 style="margin-top:6px">Mini-teste și evaluări</h1>
    <p style="color:var(--cerneala-2)">Întrebările sunt extrase la întâmplare dintr-o bancă și amestecate, așa că doi colegi nu primesc același test. La final îți scrii numele și trimiți rezultatul profesorului: îl copiezi sau îl descarci ca .txt ori .json.</p>
    <h2 style="margin-top:28px">Teste de evaluare</h2>
    <div id="evaluari" style="display:grid;gap:12px"></div>
    <h2 style="margin-top:28px">Mini-teste pe ore</h2>
    <div class="card tabel-scroll" style="padding:0"><table class="tabel" style="margin:0" id="mini"></table></div>
  </main>
  <script src="../config.js"></script>
  <script src="../data/functii.js"></script>
  <script src="../data/cuprins.js"></script>
  <script src="../assets/js/formula-engine.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/progress.js"></script>
  <script>
    (function () {
      'use strict';
      App.init({ activ: 'teste', casetaNume: 'Teste' });
      const { el } = App;
      const nota = (k) => { const n = Progres.notaTest(k); return n == null ? '—' : String(n).replace('.', ','); };
      EVALUARI.forEach((e) => document.getElementById('evaluari').append(
        el('div', { class: 'card', style: 'display:flex;gap:16px;align-items:center;flex-wrap:wrap' },
          el('div', { style: 'flex:1;min-width:220px' }, el('h3', { style: 'margin:0' }, e.titlu + ' · orele ' + e.ore[0] + '–' + e.ore[e.ore.length - 1]), el('p', { style: 'margin:4px 0 0;color:var(--cerneala-2)' }, e.descriere)),
          el('span', null, 'Cea mai bună notă: ', el('b', null, nota('evaluare-' + e.nr))),
          el('a', { class: 'btn btn-primar', href: 'test.html?evaluare=' + e.nr }, 'Începe'))));
      const t = document.getElementById('mini');
      t.append(el('tr', null, el('th', null, 'Ora'), el('th', null, 'Tema'), el('th', null, 'Nota ta'), el('th', null, '')));
      CUPRINS.forEach((o) => t.append(el('tr', null, el('td', null, String(o.nr)), el('td', null, o.titlu), el('td', null, nota('ora-' + o.nr)),
        el('td', null, o.disponibil ? el('a', { href: 'test.html?ora=' + o.nr }, 'Începe →') : el('span', { style: 'color:var(--cerneala-3)' }, 'în curând')))));
    })();
  </script>
</body>
</html>
