<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test · Excel clasa a X-a</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='6' width='24' height='18' fill='none' stroke='%232344a8' stroke-width='3'/%3E%3Crect x='23' y='20' width='7' height='7' fill='%232344a8'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <!-- test.html?ora=3      → mini-testul orei 3
       test.html?evaluare=1 → testul de evaluare 1 (orele 1–5) -->
  <main class="pagina ingust" id="continut"></main>

  <script src="../config.js"></script>
  <script src="../data/functii.js"></script>
  <script src="../data/cuprins.js"></script>
  <script src="../assets/js/formula-engine.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/progress.js"></script>
  <script src="../assets/js/spreadsheet.js"></script>
  <script src="../assets/js/charts.js"></script>
  <script src="../assets/js/spreadsheet-extra.js"></script>
  <script src="../assets/js/exercises.js"></script>
  <script src="../assets/js/worksheet.js"></script>
  <script src="../assets/js/quiz.js"></script>
  <script>
    (async function () {
      'use strict';
      App.init({ activ: 'teste', casetaNume: 'Teste' });
      const { el } = App;
      const main = document.getElementById('continut');
      const q = new URLSearchParams(location.search);
      const pad = (n) => String(n).padStart(2, '0');
      const CT = App.CFG.teste || {};
      const ora = parseInt(q.get('ora'), 10), ev = parseInt(q.get('evaluare'), 10);
      const ore = ora ? [ora] : ev ? ((EVALUARI.find((e) => e.nr === ev) || {}).ore || []) : [];
      if (!ore.length) { main.append(el('div', { class: 'card' }, el('p', null, 'Alege un test din ', el('a', { href: 'index.html' }, 'lista testelor'), '.'))); return; }
      // încarcă băncile de întrebări (fișierele care lipsesc sunt ignorate)
      await Promise.all(ore.map((n) => App.incarcaScript('../data/intrebari/ora-' + pad(n) + '.js').catch(() => null)));
      const banca = [];
      ore.forEach((n) => ((window.INTREBARI && INTREBARI[n]) || []).forEach((x) => banca.push(Object.assign({ ora: n }, x))));
      if (!banca.length) {
        main.append(el('div', { class: 'card' }, el('h1', null, 'Test indisponibil'), el('p', null, 'Întrebările pentru acest test nu au fost încă adăugate.'), el('a', { class: 'btn', href: 'index.html' }, '← Toate testele')));
        return;
      }
      const info = ora ? CUPRINS.find((c) => c.nr === ora) : EVALUARI.find((e) => e.nr === ev);
      const titlu = ora ? 'Mini-test · Ora ' + ora + ': ' + info.titlu : info.titlu + ' (orele ' + ore[0] + '–' + ore[ore.length - 1] + ')';
      document.title = titlu + ' · Excel clasa a X-a';
      new Teste.Test(main, {
        titlu, cheie: ora ? 'ora-' + ora : 'evaluare-' + ev,
        eticheta: ora ? 'Mini-test' : 'Test de evaluare',
        descriere: ora ? '' : info.descriere,
        banca, n: ora ? (CT.itemiMiniTest || 7) : (CT.itemiEvaluare || 15),
        grupare: ora ? (x) => x.tip : (x) => x.ora,
        inapoi: ora ? ['../lectii/ora-' + pad(ora) + '.html', '← Înapoi la ora ' + ora] : ['index.html', '← Toate testele']
      });
    })();
  </script>
</body>
</html>
